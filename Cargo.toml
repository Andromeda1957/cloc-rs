[package]
name = "cloc-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "An independent Rust implementation of the cloc command-line interface"
license = "MIT"
repository = "https://github.com/Andromeda1957/cloc-rs"
readme = "README.md"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
fancy-regex = "0.16"
regex = "1"
walkdir = "2"
rayon = "1"
blake3 = "1"
similar = "2"
encoding_rs = "0.8"
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
liblzma = "0.4"
zstd = "0.13"
zip = { version = "4", default-features = false, features = ["deflate", "bzip2", "zstd", "lzma"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
