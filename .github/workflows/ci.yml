name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TMPDIR: ${{ runner.temp }}/cloc-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Prepare temporary files
        shell: bash
        run: mkdir -p "$TMPDIR"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python tests/commands.py target/debug/cloc-rs
  conformance:
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ runner.temp }}/cloc-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Obtain external behavioral reference
        run: |
          mkdir -p "$TMPDIR"
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/AlDanial/cloc/v2.10/cloc -o "$TMPDIR/cloc-reference.pl"
          perl "$TMPDIR/cloc-reference.pl" --version
      - run: cargo build --locked
      - run: python3 tests/compatibility.py --reference "$TMPDIR/cloc-reference.pl" --catalog
