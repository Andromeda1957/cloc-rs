name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Prepare temporary files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cloc-rs"
          echo "TMPDIR=$RUNNER_TEMP/cloc-rs" >> "$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python tests/commands.py target/debug/cloc-rs
      - run: python tests/progress.py target/debug/cloc-rs
      - run: python tests/basic.py target/debug/cloc-rs
      - run: python tests/memory.py target/debug/cloc-rs
      - run: python tests/streaming.py target/debug/cloc-rs
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install reference-only test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends libparallel-forkmanager-perl
      - name: Obtain external behavioral reference
        run: |
          mkdir -p "$RUNNER_TEMP/cloc-rs"
          echo "TMPDIR=$RUNNER_TEMP/cloc-rs" >> "$GITHUB_ENV"
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/AlDanial/cloc/v2.10/cloc -o "$RUNNER_TEMP/cloc-rs/cloc-reference.pl"
          perl "$RUNNER_TEMP/cloc-rs/cloc-reference.pl" --version
      - run: cargo build --locked
      - run: python3 tests/compatibility.py --reference "$TMPDIR/cloc-reference.pl" --catalog
